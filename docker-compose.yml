services:
  db:
    image: postgres:17-alpine
    container_name: gvc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gvc}
      POSTGRES_USER: ${DB_USER:-gvc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Admin@fem2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gvc_admin} -d ${DB_NAME:-gvc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gvc-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gvc-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-gvc_admin}:${DB_PASSWORD:-Admin@fem2026}@db:5432/${DB_NAME:-gvc}"
      JWT_SECRET: ${JWT_SECRET:-gvc-sistema-cultura-2026-secret-key-muito-longa}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BRASIL_API_URL: ${BRASIL_API_URL:-https://brasilapi.com.br/api/cpf/v1}
      TZ: America/Rio_Branco
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gvc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gvc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - gvc-network

volumes:
  pgdata:
    driver: local

networks:
  gvc-network:
    driver: bridge